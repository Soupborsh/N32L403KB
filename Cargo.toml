[package]
name = "t90_template"
description = "Rust project for Alientek T90 soldering iron with N32L403KB MCU."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only AND Apache-2.0"
authors = ["Soupborsh"]
repository = "https://github.com/Soupborsh/t90_rust_template.git"

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
n32l40x-pac = { version = "0.1.0", git = "https://github.com/Soupborsh/n32l40x-pac.git", features = [
  "n32l403",
] }
panic-halt = "1.0.0"

[features]
app = []
in_ram = ["n32l40x-pac/rt"]

[profile.dev]
opt-level = 3
overflow-checks = false
